<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70" fill="none">
  <defs>
    <linearGradient id="ukBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="240" height="70" rx="35" fill="url(#ukBadgeGrad)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- UK Flag Shield Icon -->
  <g transform="translate(16, 15)">
    <circle cx="20" cy="20" r="19" fill="#00247D"/>
    <clipPath id="circleClip">
      <circle cx="20" cy="20" r="19"/>
    </clipPath>
    <g clip-path="url(#circleClip)">
      <!-- White Diagonals -->
      <line x1="0" y1="0" x2="40" y2="40" stroke="#FFF" stroke-width="6"/>
      <line x1="0" y1="40" x2="40" y2="0" stroke="#FFF" stroke-width="6"/>
      <!-- Red Diagonals -->
      <line x1="0" y1="0" x2="40" y2="40" stroke="#CF142B" stroke-width="2.5"/>
      <line x1="0" y1="40" x2="40" y2="0" stroke="#CF142B" stroke-width="2.5"/>
      <!-- White Cross -->
      <line x1="20" y1="0" x2="20" y2="40" stroke="#FFF" stroke-width="10"/>
      <line x1="0" y1="20" x2="40" y2="20" stroke="#FFF" stroke-width="10"/>
      <!-- Red Cross -->
      <line x1="20" y1="0" x2="20" y2="40" stroke="#CF142B" stroke-width="6"/>
      <line x1="0" y1="20" x2="40" y2="20" stroke="#CF142B" stroke-width="6"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="66" y="30" fill="#94A3B8" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1">HANDCRAFTED IN</text>
  <text x="66" y="50" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="0.5">SHEFFIELD, UK</text>
</svg>
